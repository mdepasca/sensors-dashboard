<!DOCTYPE html>
<!--
  House Sensor Station — Web Dashboard  v4
  ==========================================
  Single-file static application — no build step, no server-side code.
  Host on GitHub Pages (free) or any static file server.

  How it works:
    1. On load, the user enters the Flask backend URL and clicks Connect.
    2. The dashboard calls /api/rooms and /api/latest, builds one tab
       per room, and renders live sensor cards inside each tab.
    3. A 30-second setInterval() repeats step 2, updating only the
       .room-data zone of each panel (the Chart.js canvas is never
       replaced — this fixes the "chart disappears after a while" bug).
    4. Clicking a tab loads /api/history for that room and draws a
       24-hour temperature + CO chart.  The active tab's chart is also
       refreshed on every 30-second tick.
    5. If any room reports CO ≥ 35 ppm, a red banner appears at the top.

  External dependencies (loaded from CDN — no npm):
    • IBM Plex Mono + Syne — Google Fonts (typography)
    • Chart.js 4.4.1       — cdnjs.cloudflare.com (history chart)
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>House Sensor Station v4</title>

<!-- ── Fonts ──────────────────────────────────────────────────────── -->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;600&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">

<!-- ── Chart.js — used only for the history chart canvas ─────────── -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
/* ================================================================
   CSS CUSTOM PROPERTIES — edit these to retheme the whole dashboard
   ================================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  /* Background layers */
  --bg:      #080b12;   /* page background */
  --surf:    #0e1220;   /* header, config bar */
  --card:    #131827;   /* sensor cards, chart */

  /* Borders and text */
  --border:  rgba(255,255,255,0.06);
  --text:    #dde4f0;
  --muted:   #5a6480;   /* secondary labels, timestamps */

  /* Accent colours — also used in JS (COLORS array below) */
  --blue:    #4fa8ff;   /* temperature */
  --green:   #2de0a5;   /* humidity, online indicator */
  --orange:  #ffaa36;   /* pressure */
  --red:     #ff5e5e;   /* CO high, errors */
  --purple:  #b07aff;

  /* Typefaces */
  --mono:    'IBM Plex Mono', monospace;  /* all data values */
  --display: 'Syne', sans-serif;          /* headings, buttons */
}

/* ================================================================
   BASE
   ================================================================ */
body {
  font-family: var(--mono);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ================================================================
   HEADER — sticky bar with branding and last-update timestamp
   ================================================================ */
header {
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
  /* Stays at the top while scrolling */
  position: sticky;
  top: 0;
  z-index: 10;
}
.brand {
  font-family: var(--display);
  font-size: 20px;
  font-weight: 800;
}
.brand em { color: var(--blue); font-style: normal; }

/* Animated green dot next to the logo — shows the dashboard is live */
.dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  margin-right: 8px;
  animation: blink 2s ease-in-out infinite;
}
@keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:.3 } }

/* Timestamp updated on every successful API call */
#ts { font-size: 11px; color: var(--muted); }

/* ================================================================
   CONFIG BAR — API URL input + connect button
   The backend URL is saved to localStorage so it persists across
   page reloads without re-entry.
   ================================================================ */
.config {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 28px;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.config label {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.config input {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  padding: 6px 10px;
  width: 280px;
  outline: none;
  transition: border-color .2s;
}
.config input:focus { border-color: var(--blue); }
.btn {
  background: var(--blue);
  border: none;
  border-radius: 6px;
  color: #fff;
  cursor: pointer;
  font-family: var(--display);
  font-size: 12px;
  font-weight: 700;
  padding: 7px 16px;
  transition: opacity .2s;
}
.btn:hover { opacity: .85; }
/* Inline error message shown when an API call fails */
#err { font-size: 11px; color: var(--red); }

/* ================================================================
   CO ALERT BANNER
   Hidden by default (.co-banner); revealed by JS as .co-banner.show
   when any room's co_level is 'warn' or 'high'.
   ================================================================ */
.co-banner {
  display: none;         /* hidden when no alert */
  align-items: center;
  gap: 12px;
  padding: 10px 28px;
  background: #3a1010;   /* dark red background */
  border-bottom: 2px solid var(--red);
}
.co-banner.show { display: flex; }
.co-banner span { font-size: 13px; color: var(--red); }
.co-banner strong { color: #fff; }

/* ================================================================
   ROOM TABS — one tab per room, auto-generated from /api/rooms
   Tabs sit directly above the panel content with bottom-border removed
   to visually connect to the panel below.
   ================================================================ */
.room-tabs {
  display: flex;
  gap: 6px;
  padding: 16px 28px 0;
  flex-wrap: wrap;
}
.tab {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 8px 8px 0 0;   /* flat bottom — merges with panel */
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  padding: 8px 16px;
  transition: all .15s;
  user-select: none;
}
/* Active tab: highlighted border and matching background to the panel */
.tab.active {
  background: var(--card);
  border-color: var(--blue);
  color: var(--blue);
  border-bottom-color: var(--card);  /* hides the gap between tab and panel */
}
/* Coloured dot inside each tab — green = data < 120 s old, grey = stale */
.tab .tdot {
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  margin-right: 6px;
}
.tab.online  .tdot { background: var(--green); }
.tab.offline .tdot { background: var(--muted); }

/* ================================================================
   MAIN CONTENT — room panels
   Only the .active panel is shown; the others are hidden with display:none.
   Each panel is divided into TWO zones:
     .room-data  — sensor cards, rebuilt on every 30-second refresh
     .room-chart — chart wrapper, created ONCE and never replaced
                   (replacing the canvas would destroy the Chart.js
                    instance and cause the "empty chart" bug)
   ================================================================ */
main { padding: 0 28px 60px; }
.room-panel         { display: none; padding-top: 20px; }
.room-panel.active  { display: block; }

/* Section headings above card groups */
.sec {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin: 20px 0 10px;
}

/* ================================================================
   SENSOR CARD GRIDS
   CSS grid with auto-fill — number of columns adapts to viewport.
   .g3: temperature cards (min 170 px wide)
   .g2: humidity / pressure (min 220 px wide)
   .g1: single-item rows (pressure, max 320 px)
   ================================================================ */
.grid { display: grid; gap: 12px; }
.g3 { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.g1 { grid-template-columns: 1fr; max-width: 320px; }

/* ── Individual sensor card ───────────────────────────────────────── */
.scard {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.scard-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.scard-val {
  font-size: 34px;
  font-weight: 300;
  line-height: 1;
  letter-spacing: -1px;
}
.scard-val .unit {
  font-size: 14px;
  color: var(--muted);
  margin-left: 2px;
}
.scard-sub {
  font-size: 11px;
  color: var(--muted);
  margin-top: 5px;
}
/* Coloured accent strip along the bottom-left of the card */
.scard-bar {
  position: absolute;
  bottom: 0; left: 0;
  width: 36px; height: 3px;
  border-radius: 0 2px 0 0;
}

/* ================================================================
   CO CARD — special treatment to highlight dangerous levels
   .co-card alone → safe (normal card style)
   .co-card.co-warn → orange border
   .co-card.co-high → red border + dark red background
   ================================================================ */
.co-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
}
.co-card.co-warn { border-color: var(--orange); }
.co-card.co-high { border-color: var(--red); background: #1a0e0e; }

/* Progress bar showing CO level relative to 200 ppm max */
.co-bar-wrap {
  height: 10px;
  background: rgba(255,255,255,0.06);
  border-radius: 5px;
  margin: 10px 0 6px;
  overflow: hidden;
}
.co-bar-fill {
  height: 100%;
  border-radius: 5px;
  transition: width .5s;   /* smooth width transition on refresh */
}

/* Small badge: SAFE / WARN / HIGH */
.co-badge {
  display: inline-block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1.5px;
  padding: 3px 10px;
  border-radius: 4px;
}
.badge-safe    { background: rgba(45,224,165,.15); color: var(--green);  }
.badge-warn    { background: rgba(255,170,54,.15); color: var(--orange); }
.badge-high    { background: rgba(255,94,94,.2);   color: var(--red);    }
.badge-unknown { background: rgba(255,255,255,.05);color: var(--muted);  }

/* ================================================================
   CHART — 24-hour history
   The .chart-card wrapper and its <canvas> are created ONCE per room
   in buildTabs() and never replaced.  drawChart() either creates a
   new Chart instance (first call) or calls chart.update() (subsequent
   calls) to avoid destroying the canvas DOM node.
   ================================================================ */
.chart-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-top: 12px;
}
.chart-card canvas { max-height: 240px; }

/* ================================================================
   META ROW — node ID, last packet time, age, RSSI
   ================================================================ */
.meta {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 6px;
}
.meta strong { color: var(--text); }
</style>
</head>
<body>

<!-- ================================================================
     HEADER
     ================================================================ -->
<header>
  <div class="brand">
    <span class="dot"></span>House <em>Sensors</em>
    <span style="font-size:12px;color:var(--muted);font-weight:400">v4</span>
  </div>
  <!-- Updated by loadAll() after every successful fetch -->
  <span id="ts">non connesso</span>
</header>

<!-- ================================================================
     CONFIG BAR — API URL entry
     The URL is persisted in localStorage under the key 'api'.
     ================================================================ -->
<div class="config">
  <label>API</label>
  <input id="api-url" type="text" placeholder="https://your-backend.onrender.com">
  <button class="btn" onclick="connect()">Connetti</button>
  <span id="err"></span>
</div>

<!-- ================================================================
     CO ALERT BANNER
     Controlled by checkCoAlerts() — shown when co_level is
     'warn' or 'high' in any room.
     ================================================================ -->
<div class="co-banner" id="co-banner">
  <span>⚠ <strong>ATTENZIONE CO:</strong>
    <span id="co-banner-msg"></span>
  </span>
</div>

<!-- ================================================================
     ROOM TABS — populated dynamically by buildTabs()
     ================================================================ -->
<div class="room-tabs" id="tabs"></div>

<!-- ================================================================
     MAIN CONTENT — room panels populated dynamically
     ================================================================ -->
<main id="main-content"></main>

<!-- ================================================================
     JAVASCRIPT
     ================================================================ -->
<script>
// ── Global state ───────────────────────────────────────────────────────

// Backend base URL — read from localStorage on load, saved on connect
let API = localStorage.getItem('api') || '';
document.getElementById('api-url').value = API;

// Colour palette for sensor cards and chart lines.
// Index 0 = DHT22 #1, index 1 = DHT22 #2, etc.
const COLORS = ['#4fa8ff','#2de0a5','#ffaa36','#ff5e5e','#b07aff','#ff9f6e','#36e0e0','#ffd36e'];

// Chart.js instances, keyed by room name.
// Stored here so we can call chart.update() instead of destroying
// and recreating the canvas on every refresh.
const charts = {};

// Currently visible room — used by the auto-refresh to know which
// room's history chart to redraw.
let activeRoom = null;


// ── API helpers ────────────────────────────────────────────────────────

/**
 * connect()
 * Called when the user clicks the "Connetti" button.
 * Saves the URL, clears any error, and kicks off the first full load.
 */
async function connect() {
  API = document.getElementById('api-url').value.trim().replace(/\/$/, '');
  localStorage.setItem('api', API);
  document.getElementById('err').textContent = '';
  try {
    await loadAll();
  } catch(e) {
    document.getElementById('err').textContent = 'Errore: ' + e.message;
  }
}

/**
 * loadAll()
 * Fetches /api/rooms and /api/latest in parallel, then rebuilds tabs
 * and checks CO alert state.  Called on connect and every 30 seconds.
 */
async function loadAll() {
  const [rooms, latest] = await Promise.all([
    fetchJSON('/api/rooms'),
    fetchJSON('/api/latest')
  ]);
  buildTabs(rooms, latest);
  checkCoAlerts(latest);
  document.getElementById('ts').textContent =
    'Aggiornato ' + new Date().toLocaleTimeString();
}

/**
 * fetchJSON(path)
 * Appends path to the saved API base URL and returns parsed JSON.
 * Throws on network error or non-2xx HTTP status.
 */
async function fetchJSON(path) {
  if (!API) throw new Error('Inserisci URL API');
  const r = await fetch(API + path);
  if (!r.ok) throw new Error(r.status + ' ' + r.statusText);
  return r.json();
}


// ── CO alert banner ────────────────────────────────────────────────────

/**
 * checkCoAlerts(latest)
 * Inspects the co_level field of every room in the /api/latest response.
 * Shows the red banner if any room is 'warn' or 'high'.
 */
function checkCoAlerts(latest) {
  const alerts = [];
  Object.entries(latest).forEach(([room, d]) => {
    if (d.co_level === 'high' || d.co_level === 'warn') {
      alerts.push(
        `${room.replace(/_/g, ' ')}: ${(d.co_ppm ?? 0).toFixed(0)} ppm (${d.co_level.toUpperCase()})`
      );
    }
  });
  const banner = document.getElementById('co-banner');
  banner.classList.toggle('show', alerts.length > 0);
  document.getElementById('co-banner-msg').textContent = alerts.join(' | ');
}


// ── Tab and panel management ───────────────────────────────────────────

/**
 * buildTabs(rooms, latest)
 * Creates a tab + panel for each room returned by /api/rooms.
 * Already-existing tabs are NOT recreated — only their online/offline
 * indicator is updated.  This prevents losing the active selection
 * on every refresh cycle.
 *
 * Each panel contains two zones:
 *   .room-data  — rebuilt by renderRoomData() on every refresh
 *   .room-chart — created once; the <canvas> is never removed
 */
function buildTabs(rooms, latest) {
  const tabsEl   = document.getElementById('tabs');
  const mainEl   = document.getElementById('main-content');

  // Build a set of room names that already have tabs
  const existing = new Set(
    [...tabsEl.querySelectorAll('.tab')].map(t => t.dataset.room)
  );

  rooms.forEach(({ room }) => {
    const d      = latest[room] || {};
    const recAt  = d.received_at ? new Date(d.received_at) : null;
    // A node is considered online if it published within the last 120 seconds
    const online = recAt && (Date.now() - recAt) / 1000 < 120;

    if (!existing.has(room)) {
      // ── First time we see this room: create tab + panel ──────────────

      const tab = document.createElement('div');
      tab.className    = `tab ${online ? 'online' : 'offline'}`;
      tab.dataset.room = room;
      tab.innerHTML    = `<span class="tdot"></span>${room.replace(/_/g, ' ')}`;
      tab.onclick      = () => selectTab(room);
      tabsEl.appendChild(tab);

      // The panel has a fixed structure — the chart zone is created once
      // here and never touched again (prevents "canvas destroyed" bug).
      const panel = document.createElement('div');
      panel.className = 'room-panel';
      panel.id        = 'panel-' + room;
      panel.innerHTML = `
        <div class="room-data"></div>
        <div class="sec">Storico temperatura &amp; CO (24h)</div>
        <div class="chart-card room-chart">
          <canvas id="chart-${room}"></canvas>
        </div>`;
      mainEl.appendChild(panel);
    }

    // ── Update online/offline indicator on every refresh ─────────────
    const tab = tabsEl.querySelector(`[data-room="${room}"]`);
    if (tab) {
      // Preserve the 'active' class while updating online/offline
      const isActive = tab.classList.contains('active');
      tab.className  = `tab ${online ? 'online' : 'offline'} ${isActive ? 'active' : ''}`;
    }

    // ── Refresh sensor cards in the .room-data zone ──────────────────
    // This zone is rebuilt on every tick; the chart canvas below it is untouched.
    renderRoomData(room, d);
  });

  // Activate the first tab automatically on first load
  if (!tabsEl.querySelector('.tab.active') && rooms.length > 0) {
    selectTab(rooms[0].room);
  }
}

/**
 * selectTab(room)
 * Makes the chosen room's tab and panel active, hides all others,
 * and triggers a history load for the chart.
 */
function selectTab(room) {
  activeRoom = room;

  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.room === room)
  );
  document.querySelectorAll('.room-panel').forEach(p =>
    p.classList.toggle('active', p.id === 'panel-' + room)
  );

  // Load 24-hour history for the newly visible room
  loadRoomHistory(room);
}


// ── Sensor card rendering ──────────────────────────────────────────────

/**
 * renderRoomData(room, d)
 * Builds the HTML for sensor cards and writes it to the .room-data
 * zone only — never touches the chart canvas below it.
 *
 * Called on every 30-second refresh for all rooms (not just the active one)
 * so that all tabs show fresh data when the user switches between them.
 */
function renderRoomData(room, d) {
  const panel = document.getElementById('panel-' + room);
  if (!panel) return;
  const dataZone = panel.querySelector('.room-data');
  if (!dataZone) return;

  // Meta row: node diagnostics
  const recAt  = d.received_at ? new Date(d.received_at) : null;
  const ageSec = recAt ? Math.round((Date.now() - recAt) / 1000) : null;
  let html = `<div class="meta">
    <span>Nodo: <strong>${d.node_id || '—'}</strong></span>
    <span>Ultimo pacchetto: <strong>${recAt ? recAt.toLocaleTimeString() : '—'}</strong></span>
    ${ageSec !== null ? `<span>Età: <strong>${ageSec}s</strong></span>` : ''}
    ${d.wifi_rssi ? `<span>RSSI: <strong>${d.wifi_rssi} dBm</strong></span>` : ''}
  </div>`;

  // ── Temperature + humidity (DHT22) ──────────────────────────────────
  // The API returns d.temperature as an array of {sensor_num, temp_c, humid_pct}
  const temps = d.temperature || [];
  if (temps.length) {
    html += `<div class="sec">Temperatura &amp; Umidità (DHT22)</div>
             <div class="grid g3">`;
    temps.forEach((t, i) => {
      const col = COLORS[i % COLORS.length];
      const tv  = t.temp_c    != null ? t.temp_c.toFixed(1)    : '—';
      const hv  = t.humid_pct != null ? t.humid_pct.toFixed(1) : '—';
      html += `
        <div class="scard">
          <div class="scard-label">DHT22 #${t.sensor_num}</div>
          <div class="scard-val" style="color:${col}">${tv}<span class="unit">°C</span></div>
          <div class="scard-sub">Umidità: ${hv} %</div>
          <div class="scard-bar" style="background:${col}"></div>
        </div>`;
    });
    html += `</div>`;
  }

  // ── Pressure (BMP180) ───────────────────────────────────────────────
  // Only shown when the node has a BMP180 wired and reports pressure_hpa
  if (d.pressure_hpa != null) {
    const pv = d.pressure_hpa.toFixed(1);
    const av = d.altitude_m != null ? d.altitude_m.toFixed(0) : '—';
    html += `
      <div class="sec">Pressione (BMP180)</div>
      <div class="grid g1">
        <div class="scard">
          <div class="scard-label">Pressione barometrica</div>
          <div class="scard-val" style="color:var(--orange)">${pv}<span class="unit">hPa</span></div>
          <div class="scard-sub">Altitudine ≈ ${av} m</div>
          <div class="scard-bar" style="background:var(--orange)"></div>
        </div>
      </div>`;
  }

  // ── CO / MQ-7 ───────────────────────────────────────────────────────
  // Shown when co_ppm or co_level is present in the latest reading.
  // Card style changes based on the safety level:
  //   safe  (< 35 ppm)  → normal card, green bar
  //   warn  (35–70 ppm) → orange border, orange bar
  //   high  (> 70 ppm)  → red border, dark background, red bar
  if (d.co_ppm != null || d.co_level) {
    const ppm      = d.co_ppm ?? 0;
    const level    = d.co_level ?? 'unknown';
    // Bar width as % of 200 ppm (approximate sensor max)
    const pct      = Math.min(100, (ppm / 200) * 100);
    const barColor = level === 'high' ? 'var(--red)'
                   : level === 'warn' ? 'var(--orange)'
                   : 'var(--green)';
    const cardCls  = level === 'high' ? 'co-high'
                   : level === 'warn' ? 'co-warn'
                   : '';
    html += `
      <div class="sec">Monossido di Carbonio (MQ-7)</div>
      <div class="co-card ${cardCls}">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:4px;">
          <div class="scard-val" style="color:${barColor}">
            ${ppm.toFixed(0)}<span class="unit">ppm</span>
          </div>
          <span class="co-badge badge-${level}">${level.toUpperCase()}</span>
        </div>
        <div class="co-bar-wrap">
          <div class="co-bar-fill" style="width:${pct}%;background:${barColor}"></div>
        </div>
        <div class="scard-sub">
          SAFE &lt;35 · WARN 35–70 · HIGH &gt;70 ppm
          · ADC raw: ${d.co_raw_adc ?? '—'}
        </div>
      </div>`;
  }

  // Write the finished HTML into the data zone only
  dataZone.innerHTML = html;
}


// ── History chart ──────────────────────────────────────────────────────

/**
 * loadRoomHistory(room)
 * Fetches /api/history for the given room and hands the rows to drawChart().
 * Called when the user clicks a tab and on every 30-second refresh
 * (for the currently active tab only — no point loading all rooms).
 */
async function loadRoomHistory(room) {
  try {
    const rows = await fetchJSON(`/api/history?room=${room}&hours=24&limit=500`);
    drawChart(room, rows);
  } catch(e) {
    console.warn('History load failed:', e);
  }
}

/**
 * drawChart(room, rows)
 * Builds Chart.js datasets from the /api/history rows and either
 * creates a new Chart instance (first call for this room) or updates
 * the existing one in-place (subsequent calls).
 *
 * KEY DESIGN DECISION — why we never call chart.destroy():
 *   When renderRoomData() replaces the .room-data innerHTML, the
 *   <canvas> element is preserved because it lives in .room-chart,
 *   which is a sibling zone never touched by renderRoomData().
 *   Calling chart.destroy() or replacing the canvas would sever
 *   Chart.js's reference, making the chart disappear until the next
 *   full page reload — the bug reported in v3.
 *
 * Dual Y-axes:
 *   'temp' axis (left)  — temperature in °C, blue ticks
 *   'co'   axis (right) — CO in ppm, red ticks
 *   The 'co' axis is only declared when the room actually has CO data;
 *   declaring it without data causes Chart.js to silently fail and
 *   blank the entire chart.
 */
function drawChart(room, rows) {
  // ── Step 1: aggregate rows by timestamp ─────────────────────────────
  // The SQL JOIN in /api/history can produce multiple rows per
  // timestamp when a reading has both temperature and CO data.
  // We merge them into one object per timestamp key.
  const byTime = {};
  rows.forEach(r => {
    const key = r.received_at;
    if (!byTime[key]) byTime[key] = {};
    // Temperature — keyed by sensor number (T1, T2)
    if (r.sensor_num != null && r.temp_c != null)
      byTime[key][`T${r.sensor_num}`] = r.temp_c;
    // CO — single value per reading
    if (r.co_ppm != null)
      byTime[key]['CO'] = r.co_ppm;
  });

  // Sort chronologically
  const sorted = Object.entries(byTime).sort(([a], [b]) => a.localeCompare(b));
  if (!sorted.length) return;   // nothing to draw yet

  // Human-readable x-axis labels (HH:MM)
  const labels = sorted.map(([t]) =>
    new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  );

  // Check whether this room has any CO data in the window
  const hasCO = sorted.some(([, v]) => v['CO'] != null);

  // ── Step 2: build temperature datasets ──────────────────────────────
  // Find all unique sensor numbers that appear in the data
  const sensorNums = [
    ...new Set(rows.filter(r => r.sensor_num != null).map(r => r.sensor_num))
  ].sort();

  const tempDatasets = sensorNums.map((num, i) => ({
    label:           `DHT22 #${num} °C`,
    data:            sorted.map(([, v]) => v[`T${num}`] ?? null),
    borderColor:     COLORS[i % COLORS.length],
    backgroundColor: 'transparent',
    borderWidth:     1.5,
    pointRadius:     0,       // no dots — line only for 24h density
    tension:         0.3,
    spanGaps:        true,    // connect across null gaps (sensor offline)
    yAxisID:         'temp',  // bind to left Y axis
  }));

  // ── Step 3: build CO dataset (only if data exists) ──────────────────
  const coDataset = hasCO ? [{
    label:           'CO ppm',
    data:            sorted.map(([, v]) => v['CO'] ?? null),
    borderColor:     '#ff5e5e',
    backgroundColor: 'rgba(255,94,94,.08)',
    borderWidth:     1.5,
    pointRadius:     0,
    tension:         0.3,
    spanGaps:        true,
    yAxisID:         'co',    // bind to right Y axis
    fill:            true,    // filled area under the CO line
  }] : [];

  const datasets = [...tempDatasets, ...coDataset];

  // ── Step 4: configure Y-axes ─────────────────────────────────────────
  // The 'co' scale is only added when CO data is actually present.
  // Adding it without data causes Chart.js to fail silently.
  const scales = {
    x: {
      ticks: { color: '#5a6480', maxTicksLimit: 10, font: { size: 10 } },
      grid:  { color: 'rgba(255,255,255,0.03)' },
    },
    temp: {
      type:     'linear',
      position: 'left',
      ticks:    { color: '#4fa8ff', font: { size: 10 },
                  callback: v => v.toFixed(1) + '°C' },
      grid:     { color: 'rgba(255,255,255,0.03)' },
    },
  };
  if (hasCO) {
    scales.co = {
      type:     'linear',
      position: 'right',
      ticks:    { color: '#ff5e5e', font: { size: 10 },
                  callback: v => v + ' ppm' },
      grid:     { drawOnChartArea: false },  // no grid lines for right axis
    };
  }

  // ── Step 5: create or update the Chart instance ──────────────────────
  const canvas = document.getElementById(`chart-${room}`);
  if (!canvas) return;

  if (charts[room]) {
    // Chart already exists — update data and scales in-place.
    // 'none' skips the re-render animation for smoother live updates.
    charts[room].data.labels    = labels;
    charts[room].data.datasets  = datasets;
    charts[room].options.scales = scales;
    charts[room].update('none');
  } else {
    // First render for this room — create the Chart instance.
    charts[room] = new Chart(canvas.getContext('2d'), {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive:          true,
        maintainAspectRatio: true,
        interaction: { mode: 'index', intersect: false },
        animation:   { duration: 400 },
        plugins: {
          legend: {
            labels: { color: '#5a6480', font: { family: 'IBM Plex Mono', size: 10 } },
          },
        },
        scales,
      },
    });
  }
}


// ── Auto-refresh ───────────────────────────────────────────────────────

/**
 * refreshActiveChart()
 * Reloads history for the currently visible tab.
 * Called as part of the 30-second refresh cycle so the chart stays
 * current without requiring a manual page reload.
 */
async function refreshActiveChart() {
  if (!activeRoom) return;
  try {
    const rows = await fetchJSON(`/api/history?room=${activeRoom}&hours=24&limit=500`);
    drawChart(activeRoom, rows);
  } catch(e) { /* fail silently — UI still shows last good chart */ }
}

// Restore saved API URL and trigger initial load
if (API) connect();

// ── 30-second refresh cycle ──────────────────────────────────────────
// Two separate concerns combined into one interval:
//   1. loadAll()            → updates sensor cards for ALL rooms
//   2. refreshActiveChart() → redraws history for the VISIBLE tab only
setInterval(async () => {
  if (!API) return;
  try {
    await loadAll();
    await refreshActiveChart();
  } catch(e) { /* silent — next tick will retry */ }
}, 30000);
</script>
</body>
</html>
